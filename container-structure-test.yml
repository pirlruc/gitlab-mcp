schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: PYTHONDONTWRITEBYTECODE
      value: "1"
    - key: PYTHONUNBUFFERED
      value: "1"
  # DHI runtime nonroot (matches catalog accounts.run-as)
  user: "65532:65532"
commandTests:
  # Runtime has no shell / which — use absolute paths.
  - name: "import package"
    command: "/app/.venv/bin/python"
    args: ["-c", "import gitlab_mcp; print(gitlab_mcp.__name__)"]
    expectedOutput: ["gitlab_mcp"]
  - name: "no setuid or setgid files"
    command: "/app/.venv/bin/python"
    args:
      - "-c"
      - |
        import os, sys
        bad = []
        skip = {"proc", "sys", "dev"}
        for root, dirs, files in os.walk("/"):
            dirs[:] = [item for item in dirs if item not in skip]
            for name in files:
                path = os.path.join(root, name)
                try:
                    mode = os.lstat(path).st_mode
                except OSError:
                    continue
                if mode & 0o6000:
                    bad.append(path)
        sys.exit(1 if bad else 0)
fileExistenceTests:
  - name: "gitlab-mcp on PATH venv"
    path: "/app/.venv/bin/gitlab-mcp"
    shouldExist: true
  - name: "venv present"
    path: "/app/.venv"
    shouldExist: true
  - name: "uv absent"
    path: "/bin/uv"
    shouldExist: false
  - name: "no gcc"
    path: "/usr/bin/gcc"
    shouldExist: false
