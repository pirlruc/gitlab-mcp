name: Scorecard

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@0e78652fa9f65b9d98033ac82bf9e5308ebb17a7
    with:
      blocking: false
      publish_results: true
