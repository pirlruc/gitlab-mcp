name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  github-release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/pydevops/.github/workflows/python-release.yml@297fb0f3d7a70e26f9717eb3273933b8d5123b8a
    with:
      python_version: "3.13"

  publish-debian:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@1098e68cb5f8bfb3c38f8b227ca215b260ed29fe
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp
      dockerhub_image: pirlruc/gitlab-mcp
      platforms: linux/amd64,linux/arm64
      scripts_ref: 1098e68cb5f8bfb3c38f8b227ca215b260ed29fe
      tag_suffix: -debian
      tag_alias_unsuffixed: true
      tag_latest: true
      sign: true
      blocking: true
      dhi_login: true
      environment: release
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: MCP server for self-hosted GitLab merge requests
      structure_test_config: container-structure-test.yml
      verify_command: /app/.venv/bin/python -c "import gitlab_mcp"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-alpine:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@1098e68cb5f8bfb3c38f8b227ca215b260ed29fe
    with:
      context: .
      dockerfile: Dockerfile.alpine
      image_name: gitlab-mcp
      dockerhub_image: pirlruc/gitlab-mcp
      platforms: linux/amd64,linux/arm64
      scripts_ref: 1098e68cb5f8bfb3c38f8b227ca215b260ed29fe
      tag_suffix: -alpine
      tag_alias_unsuffixed: false
      tag_latest: true
      sign: true
      blocking: true
      dhi_login: true
      environment: release
      structure_test_config: container-structure-test.yml
      verify_command: /app/.venv/bin/python -c "import gitlab_mcp"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  digests:
    needs: [github-release, publish-debian, publish-alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout digest script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: 0e78652fa9f65b9d98033ac82bf9e5308ebb17a7
          persist-credentials: false
          sparse-checkout: scripts/append-release-digests.sh
          sparse-checkout-cone-mode: false
      - name: Append digest table
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -eu
          owner="${REPO%%/*}"
          sh scripts/append-release-digests.sh \
            "ghcr.io/${owner}/gitlab-mcp:latest" \
            "ghcr.io/${owner}/gitlab-mcp:latest-alpine"
