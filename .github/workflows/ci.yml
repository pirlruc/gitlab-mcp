name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pydevops 3.6.0. devops_ref matches the uses pin (CI-034). The caller
  # grants the union of the nested job permissions (CI-031). python-quality
  # does not run uv audit, so the audit job below stays.
  quality:
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@297fb0f3d7a70e26f9717eb3273933b8d5123b8a # 3.6.0
    with:
      devops_repository: pirlruc/pydevops
      devops_ref: 297fb0f3d7a70e26f9717eb3273933b8d5123b8a
      strictness_level: Medium
      docstring_format: Google
      python_version: "3.13"

  audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Dependency audit
        run: uv audit --preview-features audit-command
