---
# Thin caller — pinned to containerdevops@230be8e (dhi_login input).
name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@230be8e16682b8d78d19f56bad17bbdf7c41538d
    with:
      dockerfile: Dockerfile
      # Push/PR to main: blocking. Manual dispatch: respect the input.
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}

  build:
    needs: lint
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@230be8e16682b8d78d19f56bad17bbdf7c41538d
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp:ci
      structure_test_config: container-structure-test.yml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    needs: build
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@230be8e16682b8d78d19f56bad17bbdf7c41538d
    with:
      image: gitlab-mcp:ci
      image_artifact: container-image
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
