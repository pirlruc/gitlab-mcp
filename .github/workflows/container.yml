---
# Thin caller — pinned to containerdevops@4185836 (checkout_token + scripts_ref + pkg_types).
name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    # Fork PRs lack secrets; Dependabot PRs cannot use Actions secrets for private
    # reusable workflows (containerdevops).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@02ef7dd3077c57e4a6d04bbd5e207ce6a27b48bb
    with:
      dockerfile: Dockerfile
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      # Push/PR to main: blocking. Manual dispatch: respect the input.
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@02ef7dd3077c57e4a6d04bbd5e207ce6a27b48bb
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp:ci
      structure_test_config: container-structure-test.yml
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@02ef7dd3077c57e4a6d04bbd5e207ce6a27b48bb
    with:
      image: gitlab-mcp:ci
      image_artifact: container-image
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      pkg_types: library
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
