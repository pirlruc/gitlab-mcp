name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'schedule'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      dockerfiles: |
        Dockerfile
        Dockerfile.alpine
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      blocking: true
      # Nested jobs log into GHCR with the caller token and then cannot see
      # the public ci-lint index. Hadolint still runs on the host.
      run_infra_lint: false
      run_secrets_scan: false

  build-debian:
    needs: lint
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp:ci
      artifact_name: gitlab-mcp-debian
      handoff_package: gitlab-mcp
      structure_test_config: container-structure-test.yml
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      blocking: true
      dhi_login: true
      pkg_types: library
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-alpine:
    needs: lint
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      context: .
      dockerfile: Dockerfile.alpine
      image_name: gitlab-mcp:ci-alpine
      artifact_name: gitlab-mcp-alpine
      handoff_package: gitlab-mcp
      structure_test_config: container-structure-test.yml
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      blocking: true
      dhi_login: true
      pkg_types: library
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  scan-debian:
    needs: build-debian
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'schedule'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-debian.outputs.handoff_package, needs.build-debian.outputs.digest) }}
      scanners: vuln,secret
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      pkg_types: library
      results_artifact: scan-debian
      sarif_category: trivy-debian
      blocking: true

  scan-alpine:
    needs: build-alpine
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'schedule'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      scanners: vuln,secret
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      pkg_types: library
      results_artifact: scan-alpine
      sarif_category: trivy-alpine
      blocking: true

  rescan:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
    with:
      image: ghcr.io/pirlruc/gitlab-mcp:latest
      scripts_ref: 25232eb34a7073e215edc5ca8ef8ee9b8dd9b9d4
      pkg_types: os,library
      results_artifact: rescan-debian
      sarif_category: trivy-rescan-debian
      blocking: false
