---
# Thin caller — pinned to containerdevops@297e1da (checkout_token + scripts_ref).
name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@297e1da5476a3027e847dafe582d53b0d99d0483
    with:
      dockerfile: Dockerfile
      scripts_ref: 297e1da5476a3027e847dafe582d53b0d99d0483
      # Push/PR to main: blocking. Manual dispatch: respect the input.
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@297e1da5476a3027e847dafe582d53b0d99d0483
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp:ci
      structure_test_config: container-structure-test.yml
      scripts_ref: 297e1da5476a3027e847dafe582d53b0d99d0483
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@297e1da5476a3027e847dafe582d53b0d99d0483
    with:
      image: gitlab-mcp:ci
      image_artifact: container-image
      scripts_ref: 297e1da5476a3027e847dafe582d53b0d99d0483
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
