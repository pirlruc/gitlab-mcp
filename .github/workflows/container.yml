---
# Thin caller — pinned to containerdevops@e537c48 (dhi.io login secrets).
name: Container

on:
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@e537c489ce96aebcdca0f2772f108b28a3d51663
    with:
      dockerfile: Dockerfile
      blocking: ${{ inputs.blocking }}

  build:
    needs: lint
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@e537c489ce96aebcdca0f2772f108b28a3d51663
    with:
      context: .
      dockerfile: Dockerfile
      image_name: gitlab-mcp:ci
      structure_test_config: container-structure-test.yml
      blocking: ${{ inputs.blocking }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    needs: build
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@e537c489ce96aebcdca0f2772f108b28a3d51663
    with:
      image: gitlab-mcp:ci
      image_artifact: container-image
      blocking: ${{ inputs.blocking }}
