# SC-DEP-001/002/003 — single multi-ecosystem PR, monthly, all semver levels.
# Cadence: docs/guardrails/supply-chain/profile.thresholds.yml (after submodule bump).
# Multi-ecosystem docs:
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# Re-check 2026-08-09: closed stale per-ecosystem PRs so all-dependencies can open.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
