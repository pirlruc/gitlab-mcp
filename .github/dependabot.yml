# SC-DEP-001/002/003/006 — one multi-ecosystem PR, monthly, cooldown 7 days.
# Security updates ignore multi-ecosystem groups, so each ecosystem groups them.
# gitsubmodule stays outside the group (SC-DEP-004).

version: 2

registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    registries:
      - dhi
    cooldown:
      default-days: 7
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
