      - id: GLMCP-020
        status: open
        title: Decide create_merge_request vs intentional block
        overview:
          problem: >-
            Official MCP includes create_merge_request (with assignees, reviewers,
            labels, milestone). This server documents create/merge/close as explicitly
            unavailable for Free-tier agent safety. Leaving the gap unrecorded forces
            every agent to discover the mismatch at runtime.
          goal: >-
            Record the product decision: either implement create_merge_request with the
            official parameters under write gating (still no merge/close), or keep the
            block and document official-tool divergence in docs/tools.md with a stable
            "unavailable" error shape agents can detect.
        architecture:
          target: docs/tools.md and optionally src/gitlab_mcp/tools/writes.py
          modules:
            - docs/tools.md
            - src/gitlab_mcp/tools/writes.py
            - src/gitlab_mcp/server.py
            - README.md
        acceptance_criteria:
          - Epic body states the chosen path (implement or permanent block)
          - If implement: tool matches official params; merge/close remain unavailable
          - If block: docs/tools.md lists create_merge_request under Explicitly unavailable with rationale
          - README Features table updated to match the decision
        guardrail_refs:
          - PY-SEC-002
          - PY-DOC-001
        tasks:
          - id: GLMCP-020-T1
            status: open
            title: Implement create_merge_request or document permanent unavailability
            instructions:
